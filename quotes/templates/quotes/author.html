{% extends "quotes/base.html" %}

{% block content %}
    <div class="bg-white p-4 rounded shadow-sm">
        <h2 class="text-primary">{{ author.fullname }}</h2>
        <p class="text-muted">
            <strong>Дата народження:</strong> {{ author.born_date }}<br>
            <strong>Місце народження:</strong> {{ author.born_location }}
        </p>
        <hr>
        <h5 class="text-secondary mb-3">Біографія:</h5>
        <p style="white-space: pre-wrap; line-height: 1.6;">{{ author.description }}</p>
        <a href="{% url 'quotes:root' %}" class="btn btn-outline-secondary mt-3"> повернутися до цитат</a>
    </div>
{% endblock %}
